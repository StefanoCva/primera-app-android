# name: Hola Mundo CI

# # Se ejecutará en cada push al repositorio
# on:
#   push:
#     branches: [ main, developer ]

# jobs:
#   hola:
#     runs-on: ubuntu-latest

#     steps:
#       # Paso 1: Clonar el repositorio
#       - name: Checkout del código
#         uses: actions/checkout@v3

#       # Paso 2: Ejecutar un comando
#       - name: Imprimir Hola Mundo
#         run: echo "¡Hola Mundo desde GitHub Actions!"
name: Hola Mundo CI

# Se ejecutará en cada push al repositorio
on:
  push:
    branches: [ main, developer ]

jobs:
  hola:
    runs-on: ubuntu-latest

    env:
      MENSAJE: "¡Hola Mundo desde GitHub Actions con variable!"

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # Paso 2: Ejecutar un comando usando la variable
      - name: Imprimir Hola Mundo
        run: echo "$MENSAJE"
